on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    name: test ${{matrix.otp}} on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    container:
      image: erlang:${{matrix.otp}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        otp:
          - "29"
          - "28"
          - "27"
          - "26"
          - "25"
    steps:
      - uses: actions/checkout@v7
      - run: make test
      - run: make edoc
      - run: REBAR=rebar make test

  hex-publish-dry-run:
    name: hex publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with .github/workflows/release.yml
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "29"
          rebar3-version: "3.28.0"
      - name: Install rebar3_hex
        run: |
          mkdir -p ~/.config/rebar3
          echo '{plugins, [{rebar3_hex, "7.5.0"}]}.' > ~/.config/rebar3/rebar.config
      - run: rebar3 hex publish -r hexpm --dry-run --yes
